<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0d14" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#0a0d14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Unchensed AI" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <title>Unchensed AI by Dhrubo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/marked-highlight/bundled.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/styles/github-dark.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Sessions">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
      </button>
      <div class="title-wrap">
        <div class="brand">Unchensed AI <span class="brand-by">by Dhrubo</span></div>
        <div class="subtitle" id="statusBadge">·_·</div>
      </div>
      <button id="newChatBtn" class="icon-btn" aria-label="New chat">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/></svg>
      </button>
    </header>

    <div class="body">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-inner">
          <div class="sidebar-header">Sessions</div>
          <ul id="sessionList" class="session-list"></ul>
          <button id="clearAllBtn" class="ghost-btn danger">Clear all data</button>
          <div class="sidebar-footer">
            <label class="toggle-row">
              <input type="checkbox" id="toolsToggle" checked />
              <span>Agent mode (tools)</span>
            </label>
            <div class="hint-text">Tools: calculator, time, web, files</div>
          </div>
        </div>
        <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
      </aside>

      <main class="chat">
        <div id="messages" class="messages" tabindex="-1"></div>

        <div id="attachments" class="attachments"></div>

        <form id="inputBar" class="input-bar">
          <button type="button" id="attachBtn" class="icon-btn" aria-label="Attach files">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M16.5 6v11.5a4.5 4.5 0 1 1-9 0V5.5a3 3 0 0 1 6 0V17a1.5 1.5 0 0 1-3 0V7h-1.5v10a3 3 0 0 0 6 0V5.5a4.5 4.5 0 0 0-9 0v12a6 6 0 0 0 12 0V6z"/></svg>
          </button>
          <input type="file" id="fileInput" multiple hidden />
          <textarea id="prompt" class="prompt" rows="1" placeholder="Message Unchensed AI…" autocomplete="off" enterkeyhint="send"></textarea>
          <button type="submit" id="sendBtn" class="send-btn" aria-label="Send">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 20l18-8L3 4v6l13 2-13 2z"/></svg>
          </button>
          <button type="button" id="stopBtn" class="stop-btn hidden" aria-label="Stop">
            <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>
          </button>
        </form>
      </main>
    </div>
  </div>

  <!-- Templates -->
  <template id="msg-user">
    <div class="msg user">
      <div class="msg-bubble"><div class="msg-content"></div></div>
    </div>
  </template>
  <template id="msg-ai">
    <div class="msg ai">
      <div class="msg-avatar">D</div>
      <div class="msg-bubble">
        <div class="msg-content"></div>
        <div class="msg-tools" data-role="tools"></div>
      </div>
    </div>
  </template>
  <template id="msg-tool">
    <div class="tool-item">
      <div class="tool-head"><span class="tool-name"></span><span class="tool-status">…</span></div>
      <pre class="tool-args"></pre>
      <pre class="tool-result hidden"></pre>
    </div>
  </template>
  <template id="attachment-chip">
    <div class="chip">
      <span class="chip-name"></span>
      <button class="chip-x" aria-label="Remove">×</button>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/marked@14.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.10.0/build/highlight.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
